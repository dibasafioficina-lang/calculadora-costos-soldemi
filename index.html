<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Herramienta interna de Soldemi para costear el inventario: PDV con descuento, utilidad y comparativo contra la competencia.">
<title>Calculadora de Costos Soldemi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<!-- SRI: si el CDN llegara a servir un archivo distinto al verificado, el navegador lo rechaza en lugar de
     ejecutarlo sobre el inventario. Mismo hash que usa Mi Asistente Contable para esta misma versión. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
        integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root{
    --ink:#4A3B41;
    --heading:#573B46;
    --paper:#FBF3F2;
    --brand:#B56B86;
    --brand-dark:#935068;
    --brand-light:#F7E4EC;
    --brand-lighter:#FBE6EC;
    --slate:#93797F;
    --line:#F6E6EA;
    --ok:#4F9878;
    --ok-bg:#EAF3EE;
    --alert:#B5524A;
    --alert-bg:#FBE9E7;
    --warn:#9A6E1E;
    --warn-bg:#FBF1E3;
    --card:#FFFFFF;
    --dz-empty-bg:#FDF6F8;
    --dz-empty-line:#ECD3DC;
    --dz-filled-bg:#F6FBF8;
    --dz-filled-line:#CFE3D6;
    --note-bg:#FFF8F3;
    --note-line:#ECCDBF;
    --note-text:#9C7D6D;
    --accent-purple-bg:#ECE7F6;
    --accent-purple:#8467B0;
    --accent-green-bg:#E4F0EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Mulish",system-ui,"Segoe UI",Arial,sans-serif;
    background:radial-gradient(120% 90% at 85% -10%, #FBE3EA 0%, var(--paper) 46%, var(--paper) 100%);
    background-attachment:fixed;
    color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .app{max-width:1240px;margin:0 auto;padding:26px 56px 64px}
  @media (max-width:900px){ .app{padding:20px 18px 48px} }

  /* Encabezado */
  .masthead{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:22px;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:13px}
  .logo-box{width:42px;height:42px;border-radius:13px;background:linear-gradient(150deg,#E79BB2,#C07A95);
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(192,122,149,.32);flex-shrink:0}
  .logo-mark{width:15px;height:15px;border:2.5px solid #fff;border-radius:5px 5px 5px 0}
  .masthead h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:20px;letter-spacing:.2px;color:var(--heading)}
  .app-ver{font-size:11.5px;font-weight:800;color:var(--slate);background:#fff;border:1px solid var(--line);
    padding:4px 10px;border-radius:999px;margin-right:auto;margin-left:4px}
  .user-chip{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 16px;background:#fff;
    border-radius:999px;box-shadow:0 4px 14px rgba(160,110,130,.10)}
  .user-chip .user-name{font-size:13.5px;font-weight:600;color:#7A6068}
  .user-chip .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(150deg,#F3C4D1,#D693AA);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0}
  .crumb{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--slate);margin-bottom:18px}
  .crumb button{background:none;border:none;color:var(--brand);font-weight:800;cursor:pointer;font-size:14px;padding:0;font-family:inherit}
  .crumb button:hover{color:var(--brand-dark);text-decoration:underline}

  /* Menu de modulos */
  .hero{margin-bottom:36px;animation:floatIn .5s ease both}
  .greet{font-size:14px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand);margin-bottom:10px}
  .hero-title{font-family:"DM Serif Display",serif;font-weight:400;font-size:42px;line-height:1.1;color:var(--heading);max-width:620px}
  .hero-sub{font-size:16.5px;color:var(--slate);margin-top:12px;max-width:560px;line-height:1.55}
  @keyframes floatIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

  .modules-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  @media (max-width:820px){ .modules-grid{grid-template-columns:1fr} .hero-title{font-size:32px} }
  .module-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 26px 24px;
    box-shadow:0 10px 30px rgba(158,104,126,.09);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;
    text-align:left;font-family:inherit;width:100%;color:inherit}
  .module-card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(158,104,126,.18)}
  .module-card.disabled{opacity:.6;cursor:default}
  .module-card.disabled:hover{transform:none;box-shadow:0 10px 30px rgba(158,104,126,.09)}
  .module-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .icon-box{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;

  .tag-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;

  .module-card p{font-size:14.5px;color:var(--slate);margin-top:7px;line-height:1.5}
  .module-action{display:flex;align-items:center;gap:7px;margin-top:20px;font-size:13.5px;font-weight:800;color:var(--brand)}

  .module-action .arrow{font-size:16px;transform:translateY(.5px)}

  .note-banner{margin-top:30px;display:flex;align-items:center;gap:12px;padding:18px 24px;
    background:var(--note-bg);border:1px dashed var(--note-line);border-radius:18px;color:var(--note-text)}
  .note-banner .ico{font-size:20px}
  .note-banner .txt{font-size:13.5px;line-height:1.5}

  /* Modulo */

  .dz input[type=file]{display:none}
  .dz .btn-sel{font-size:12.5px;font-weight:800;background:#fff;color:var(--brand);border:1.5px solid var(--line);

    font-family:inherit}
  .dz .btn-sel:hover{background:var(--brand);color:#fff;border-color:var(--brand)}

  .run-bar{display:flex;align-items:center;gap:14px;margin:22px 0 0;flex-wrap:wrap}
  .btn-run{background:linear-gradient(150deg,#E79BB2,#C07A95);color:#fff;border:none;font-family:"Mulish";

    box-shadow:0 10px 24px rgba(192,122,149,.35);transition:all .15s ease}

  .run-note{font-size:13px;color:var(--slate);font-weight:600}

  .opts{display:flex;gap:22px;align-items:center;font-size:13px;color:var(--slate);flex-wrap:wrap;font-weight:600}

  .opts input[type=number]{width:72px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit}
  .opts .formula{font-size:12px;color:var(--brand);font-weight:700}

  /* Resultados */
  .results-head{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 16px;flex-wrap:wrap;gap:12px}
  .results-head h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:24px;color:var(--heading)}
  .summary-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .chip{font-size:12.5px;font-weight:800;padding:7px 14px;border-radius:999px;background:var(--brand-light);color:var(--brand-dark)}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.alert{background:var(--alert-bg);color:var(--alert)}
  .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .chip.comp{background:var(--accent-purple-bg);color:var(--accent-purple)}
  .btn-export{background:#fff;border:1.5px solid var(--line);color:var(--brand);font-family:"Mulish";font-size:13.5px;font-weight:800;
    padding:10px 20px;border-radius:999px;cursor:pointer;box-shadow:0 6px 16px rgba(158,104,126,.08)}
  .btn-export:hover{background:var(--brand);color:#fff;border-color:var(--brand)}

  .filtros{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:13px;font-weight:600;color:var(--slate)}
  .filtros input[type=search],.filtros select{padding:8px 12px;border:1.5px solid var(--line);border-radius:999px;
    font-family:inherit;font-size:13px;color:var(--ink);background:#fff}
  .filtros input[type=search]{width:260px;max-width:100%}
  .filtros select{max-width:230px}
  .vistas{display:flex;gap:6px;flex-wrap:wrap}
  .vistas button{font-family:inherit;font-size:12.5px;font-weight:800;padding:7px 14px;border-radius:999px;
    border:1.5px solid var(--line);background:#fff;color:var(--slate);cursor:pointer}
  .vistas button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

  .step-block{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);
    box-shadow:0 8px 22px rgba(158,104,126,.07)}
  .step-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;
    background:var(--brand-lighter);flex-wrap:wrap}
  .step-head h4{font-family:"DM Serif Display",serif;font-weight:400;font-size:16px;color:var(--heading)}
  .step-head .count{font-family:"Mulish";font-size:12.5px;font-weight:700;color:var(--brand-dark)}

  .tabla-scroll{overflow-x:auto;max-height:min(70vh,760px);overflow-y:auto}
  .costos-tabla{width:100%;border-collapse:collapse;font-size:14px;min-width:1180px}

    text-transform:uppercase;letter-spacing:.3px;color:var(--slate);padding:10px;border-bottom:2px solid var(--line);
    white-space:nowrap}
  .costos-tabla th .th-btn{font-family:inherit;font-size:inherit;font-weight:800;letter-spacing:inherit;
    text-transform:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
  .costos-tabla th .th-btn:hover{color:var(--brand)}
  .costos-tabla th[aria-sort] .th-btn{color:var(--brand-dark)}
  .costos-tabla th.tleft,.costos-tabla td.tleft{text-align:left}
  .costos-tabla th.g-calc{background:var(--brand-light);color:var(--brand-dark)}
  .costos-tabla th.g-comp{background:var(--accent-purple-bg);color:var(--accent-purple)}
  .costos-tabla td{padding:8px 10px;text-align:right;border-bottom:1px solid #F3EAEE;vertical-align:top}
  .costos-tabla td.g-calc{background:#FDF6F9}
  .costos-tabla td.g-comp{background:#F8F6FC}
  .costos-tabla tbody tr:hover td{background:#FCF7F9}
  .costos-tabla tbody tr:hover td.g-comp{background:#F5F2FB}
  .cod{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--slate);white-space:nowrap}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .nom{max-width:330px;min-width:240px;line-height:1.35}
  .mrc{color:var(--slate);font-size:12.5px;max-width:150px}
  .pos{color:var(--ok);font-weight:700}
  .neg{color:var(--alert);font-weight:700}
  .nulo{color:#BCAAB1}
  tr.f-alert td:first-child{box-shadow:inset 3px 0 0 var(--alert)}
  tr.f-warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
  .mini-chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.2px;padding:2px 7px;
    border-radius:999px;margin-top:4px}
  .mini-chip.alert{background:var(--alert-bg);color:var(--alert)}
  .mini-chip.warn{background:var(--warn-bg);color:var(--warn)}
  .comp-input{width:96px;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;
    font-size:13px;text-align:right;font-variant-numeric:tabular-nums;background:#fff;color:var(--ink)}
  .comp-input:focus{outline:2px solid var(--accent-purple);outline-offset:0;border-color:var(--accent-purple)}
  .comp-input::-webkit-outer-spin-button,.comp-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .comp-input[type=number]{-moz-appearance:textfield}
  .tabla-pie{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;
    border-top:1px solid var(--line);background:#FDFAFB;flex-wrap:wrap}
  .tabla-pie .cuenta{font-size:12.5px;color:var(--slate);font-weight:600;font-variant-numeric:tabular-nums}
  .btn-mas{font-family:inherit;font-size:12.5px;font-weight:800;background:#fff;color:var(--brand);
    border:1.5px solid var(--line);padding:8px 16px;border-radius:999px;cursor:pointer}
  .btn-mas:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .vacio{padding:40px 20px;text-align:center;color:var(--slate)}
  .vacio b{display:block;font-family:"DM Serif Display",serif;font-weight:400;font-size:18px;color:var(--heading);margin-bottom:5px}

  footer.note{font-size:12.5px;color:var(--slate);margin-top:34px;border-top:1px solid var(--line);padding-top:16px}
  footer.note b{color:var(--heading)}
  footer.note .formulas{margin-top:8px;line-height:1.9}
  footer.note code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--heading);color:#fff;
    padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:60;
    box-shadow:0 10px 28px rgba(87,59,70,.35);max-width:min(88vw,540px);text-align:center}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>

<body>
<div class="app" id="app"></div>

<script>
"use strict";

var APP_VERSION = "2026.09.11";

/* ---------------- Estado ----------------
   Todo vive en memoria. A diferencia de Mi Asistente Contable, acá no se guarda NADA en localStorage
   —ni siquiera preferencias de vista—: al recargar la pestaña la sesión arranca limpia. */
var STATE = {
  view: "menu",
  files: { inventario: null },
  options: { descuento: 30 },
  productos: null,          // filas leídas del Excel
  ui: {
    q: "", marca: "", vista: "todos",
    orden: "nombre", dir: 1, mostrar: 120,
    comp: {}                // Item Number -> costo de competencia tipeado a mano
  }
};

var app = document.getElementById("app");
var PASO = 120;             // filas que se agregan por tanda al pulsar "Mostrar más"

/* ---------------- Utilidades ---------------- */
// Escapa texto que viene de un ARCHIVO antes de meterlo en innerHTML. Sin esto, una celda del Excel con
// "<svg onload=...>" se ejecuta como HTML en el navegador de quien abre el reporte.
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
// Formato de las cifras que se MUESTRAN: separador de miles + 2 decimales (1,000.00).
function fmt(n){
  var v=Number(n); if(isNaN(v)) v=0;
  var neg=v<0, partes=Math.abs(v).toFixed(2).split(".");
  return (neg?"-":"")+partes[0].replace(/\B(?=(\d{3})+(?!\d))/g,",")+"."+partes[1];
}
// El costo del sistema viene con 4 decimales (1.3067). Redondearlo a 2 en pantalla escondería diferencias
// reales de costeo, así que se muestran los decimales que traiga, con un mínimo de dos.
function fmt4(n){
  var v=Number(n); if(isNaN(v)) v=0;
  var neg=v<0, s=Math.abs(v).toFixed(4).replace(/0+$/,"").replace(/\.$/,"");
  var partes=s.split("."); if(partes.length===1) partes.push("00");
  if(partes[1].length===1) partes[1]+="0";
  return (neg?"-":"")+partes[0].replace(/\B(?=(\d{3})+(?!\d))/g,",")+"."+partes[1];
}
function fmtEnt(n){ var v=Number(n)||0; return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function normTxt(s){
  if(s===null||s===undefined) return "";
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
}
// Los montos del sistema llegan como número, pero un Excel reexportado a mano puede traerlos como texto
// ("1.234,56" o "B/. 12.30"). Se limpia antes de operar para no terminar sumando NaN.
function num(v){
  if(typeof v==="number") return isFinite(v)? v : 0;
  if(v===null||v===undefined||v==="") return 0;
  var s=String(v).replace(/[^0-9,.\-]/g,"");
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1) s=s.replace(/\./g,"").replace(",",".");
  else if(s.indexOf(",")>-1) s=s.replace(",",".");
  var n=parseFloat(s);
  return isFinite(n)? n : 0;
}
function toast(msg){
  var t=document.createElement("div");
  t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 3600);
}

/* ---- De donde sale el archivo ----
   El nombre de la casilla usa el vocabulario del sistema de origen, no el de quien va a usar esto. Sin la
   instruccion de exportacion, alguien que no conozca el circuito no puede ni empezar. */
var DE_DONDE = {
  inventario: "Del sistema: Inventario → Inventario Actual → Exportar a Excel. Se exporta completo, sin filtrar por marca ni por bodega: el listado sale con todo lo que traiga el archivo. No hace falta borrar columnas ni renombrar encabezados."
};

/* ---- Lectura del Excel ----
   Las columnas se detectan por NOMBRE de encabezado (tolerante a acentos y mayúsculas). Si el sistema
   cambiara los títulos, se cae a la POSICIÓN que tienen hoy en el export: B, D, E, G, J y K. */
var ENCABEZADOS = {
  item:   ["item number","itemnumber","item","codigo de barras","upc","upc_code"],
  nombre: ["nombre","descripcion","description"],
  marca:  ["marca","brand"],
  stock:  ["instock","in stock","stock","existencia","existencias"],
  costo:  ["costo prom. nac.","costo prom nac","costo promedio nac","costo nac","costo"],
  precio: ["precio base","precio","precio de venta"]
};
var POSICION = { item:1, nombre:3, marca:4, stock:6, costo:9, precio:10 };

function mapearColumnas(fila){
  var idx={}, usado={}, enc=(fila||[]).map(normTxt);
  Object.keys(ENCABEZADOS).forEach(function(clave){
    var hallado=-1;
    for(var h=0; h<ENCABEZADOS[clave].length && hallado<0; h++){
      var buscado=normTxt(ENCABEZADOS[clave][h]);
      for(var i=0;i<enc.length;i++){
        if(usado[i]) continue;
        if(enc[i]===buscado){ hallado=i; break; }
      }
    }
    if(hallado<0) hallado=POSICION[clave];
    idx[clave]=hallado; usado[hallado]=true;
  });
  return idx;
}

function leerInventario(buffer){
  var wb = XLSX.read(buffer, {type:"array"});
  var ws = wb.Sheets[wb.SheetNames[0]];
  var grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:false});
  if(!grid.length) throw new Error("La hoja está vacía.");
  var idx = mapearColumnas(grid[0]||[]);
  var filas=[];
  for(var i=1;i<grid.length;i++){
    var g=grid[i]; if(!g) continue;
    var item=g[idx.item], nombre=g[idx.nombre];
    // El export cierra con una fila suelta sin código ni nombre; se descarta para que no cuente como producto.
    if((item===null||item===undefined||item==="") && (nombre===null||nombre===undefined||nombre==="")) continue;
    filas.push({
      item:   String(item===null||item===undefined?"":item).trim(),
      nombre: String(nombre===null||nombre===undefined?"":nombre).trim(),
      marca:  String(g[idx.marca]===null||g[idx.marca]===undefined?"":g[idx.marca]).trim(),
      stock:  num(g[idx.stock]),
      costo:  num(g[idx.costo]),
      precio: num(g[idx.precio])
    });
  }
  if(!filas.length) throw new Error("No se encontraron filas de productos.");
  return filas;
}

/* ---------------- Cálculo ---------------- */
function calcular(p){
  var d = STATE.options.descuento/100;
  var pdv = p.precio*(1-d);
  var utilidad = pdv - p.costo;                          // utilidad = PDV con descuento − costo
  var pct = pdv>0 ? (utilidad/pdv)*100 : null;
  var cc = STATE.ui.comp[p.item];
  var dif = (typeof cc==="number") ? cc - pdv : null;    // positivo = la competencia está por encima
  return {pdv:pdv, utilidad:utilidad, pct:pct, cc:(typeof cc==="number"?cc:null), dif:dif};
}
// Rojo: el producto no puede costearse o se vende perdiendo. Ámbar: se puede costear pero falta un dato.
function alerta(p, c){
  if(p.costo<=0 || c.utilidad<0) return "alert";
  if(p.precio<=0 || p.stock<=0) return "warn";
  return "";
}

function conectarCarga(){
  var dz = document.querySelector('.dz[data-key="inventario"]');
  if(!dz) return;
  var input = dz.querySelector('input[type=file]');
  input.onchange = function(e){
    var f = e.target.files && e.target.files[0];
    if(f) tomarArchivo(f);
    e.target.value = "";
  };
  ["dragenter","dragover"].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add("dragover"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove("dragover"); });
  });
  dz.addEventListener("drop", function(e){
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) tomarArchivo(f);
  });
}

function tomarArchivo(f){
  STATE.files.inventario = f;
  STATE.productos = null;          // el listado viejo ya no corresponde al archivo nuevo
  STATE.ui.mostrar = PASO;
  render();
}

function ejecutar(){
  var f = STATE.files.inventario;
  if(!f) return;
  if(typeof XLSX==="undefined"){ toast("No se pudo cargar el lector de Excel. Recargá la página."); return; }
  var btn = document.getElementById("btnRun");
  if(btn){ btn.disabled = true; btn.textContent = "Leyendo…"; }
  var fr = new FileReader();
  fr.onload = function(e){
    try{
      STATE.productos = leerInventario(new Uint8Array(e.target.result));
      STATE.ui.mostrar = PASO;
      STATE.ui.q = ""; STATE.ui.marca = ""; STATE.ui.vista = "todos";
      render();
      toast(fmtEnt(STATE.productos.length)+" productos costeados");
    }catch(err){
      render();
      toast("No se pudo leer el archivo: "+(err && err.message ? err.message : "formato no reconocido"));
    }
  };
  fr.onerror = function(){ render(); toast("No se pudo abrir el archivo."); };
  fr.readAsArrayBuffer(f);
}

/* ---- Resultados ---- */
var COLUMNAS = [
  {k:"item",   t:"Item Number", cls:"tleft cod", grp:""},
  {k:"nombre", t:"Nombre",      cls:"tleft nom", grp:""},
  {k:"marca",  t:"Marca",       cls:"tleft mrc", grp:""},
  {k:"stock",  t:"InStock",     cls:"num",       grp:""},
  {k:"costo",  t:"Costo Prom. Nac.", cls:"num",  grp:""},
  {k:"precio", t:"Precio Base", cls:"num",       grp:""},
  {k:"pdv",    t:"PDV c/desc",  cls:"num g-calc", grp:"g-calc"},
  {k:"utilidad", t:"Utilidad",  cls:"num g-calc", grp:"g-calc"},
  {k:"pct",    t:"% Utilidad",  cls:"num g-calc", grp:"g-calc"},
  {k:"cc",     t:"Costo competencia", cls:"num g-comp", grp:"g-comp"},
  {k:"dif",    t:"Dif. vs PDV", cls:"num g-comp", grp:"g-comp"}
];

function filtradas(){
  var q = normTxt(STATE.ui.q), m = STATE.ui.marca, v = STATE.ui.vista, out = [];
  for(var i=0;i<STATE.productos.length;i++){
    var p = STATE.productos[i];
    if(m && p.marca!==m) continue;
    if(q && normTxt(p.nombre).indexOf(q)<0 && normTxt(p.marca).indexOf(q)<0 && String(p.item).indexOf(q)<0) continue;
    var c = calcular(p);
    if(v==="stock" && !(p.stock>0)) continue;
    if(v==="comparados" && c.cc===null) continue;
    if(v==="alertas" && !alerta(p,c)) continue;
    out.push({p:p, c:c});
  }
  var k = STATE.ui.orden, dir = STATE.ui.dir;
  out.sort(function(a,b){
    var va=valor(a,k), vb=valor(b,k);
    if(va===null) return 1;
    if(vb===null) return -1;
    if(typeof va==="string") return va.localeCompare(vb,"es")*dir;
    return (va-vb)*dir;
  });
  return out;
}
function valor(o,k){
  if(k==="item") return String(o.p.item);
  if(k==="nombre"||k==="marca") return o.p[k];
  if(k==="stock"||k==="costo"||k==="precio") return o.p[k];
  return o.c[k]===undefined ? null : o.c[k];
}

  }).join("");

      '<select id="fMarca">'+opciones+'</select>' +
      '<div class="vistas" id="fVistas">'+btnVistas+'</div>' +
    '</div>' +
    '<div class="step-block">' +
      '<div class="step-head"><h4>Productos</h4><span class="count" id="cuentaHead"></span></div>' +
      '<div class="tabla-scroll"><table class="costos-tabla">' +
        '<thead><tr id="encabezado"></tr></thead><tbody id="cuerpo"></tbody>' +
      '</table></div>' +
      '<div class="tabla-pie"><span class="cuenta" id="cuentaPie"></span><button class="btn-mas" id="btnMas" hidden>Mostrar más</button></div>' +
    '</div>';
}

function resumenHtml(){
  var n=STATE.productos.length, conStock=0, alertas=0, comparados=0, debajo=0;
  var sumUtil=0, sumPdv=0;
  STATE.productos.forEach(function(p){
    var c=calcular(p);
    if(p.stock>0) conStock++;
    if(alerta(p,c)) alertas++;
    if(c.cc!==null){ comparados++; if(c.dif<0) debajo++; }
    if(p.costo>0 && p.precio>0){ sumUtil+=c.utilidad; sumPdv+=c.pdv; }
  });
  var prom = sumPdv>0 ? (sumUtil/sumPdv)*100 : null;
  var h = '<span class="chip">'+fmtEnt(n)+' productos</span>' +
    '<span class="chip">'+fmtEnt(conStock)+' con stock</span>' +
    '<span class="chip '+(prom!==null && prom>0 ? "ok" : "warn")+'">Utilidad promedio '+(prom===null?"—":fmt(prom)+"%")+'</span>' +
    '<span class="chip '+(alertas?"alert":"ok")+'">'+(alertas? fmtEnt(alertas)+" con alerta" : "Sin alertas")+'</span>';
  if(comparados) h += '<span class="chip comp">'+fmtEnt(comparados)+' comparados · '+fmtEnt(debajo)+' por debajo de tu PDV</span>';
  return h;
}

function pintarEncabezado(){
  var d = STATE.options.descuento, html="";
  COLUMNAS.forEach(function(c){
    var etiqueta = c.k==="pdv" ? ("PDV con "+d+"% desc") : c.t;
    var ordenado = (STATE.ui.orden===c.k);
    var flecha = ordenado ? (STATE.ui.dir===1 ? " ▲" : " ▼") : "";
    html += '<th class="'+(c.grp?c.grp+" ":"")+(c.cls.indexOf("tleft")>-1?"tleft":"")+'"'+
      (ordenado ? ' aria-sort="'+(STATE.ui.dir===1?"ascending":"descending")+'"' : '')+'>'+
      '<button class="th-btn" type="button" data-orden="'+c.k+'">'+esc(etiqueta)+flecha+'</button></th>';
  });
  document.getElementById("encabezado").innerHTML = html;
}

function pintarTabla(){
  // Se repinta SOLO el cuerpo de la tabla, no la vista entera: un render completo en cada tecla le sacaría
  // el foco al campo de costo de competencia que la persona está tipeando.
  var lista = filtradas(), total = lista.length;
  var trozo = lista.slice(0, STATE.ui.mostrar), html="";
  for(var i=0;i<trozo.length;i++){
    var p=trozo[i].p, c=trozo[i].c, f=alerta(p,c), mini="";
    if(p.costo<=0) mini='<span class="mini-chip alert">sin costo</span>';
    else if(c.utilidad<0) mini='<span class="mini-chip alert">se vende perdiendo</span>';
    else if(p.precio<=0) mini='<span class="mini-chip warn">sin precio</span>';
    else if(p.stock<=0) mini='<span class="mini-chip warn">sin stock</span>';

    var clsPct = c.pct===null ? "nulo" : (c.pct<0 ? "neg" : "");
    var clsUtil = c.utilidad<0 ? "neg" : "";
    var clsDif = c.dif===null ? "nulo" : (c.dif>0 ? "pos" : (c.dif<0 ? "neg" : "nulo"));

    html += '<tr'+(f?' class="f-'+f+'"':'')+'>' +
      '<td class="tleft cod">'+esc(p.item)+'</td>' +
      '<td class="tleft nom">'+esc(p.nombre)+(mini?'<br>'+mini:'')+'</td>' +
      '<td class="tleft mrc">'+esc(p.marca||"—")+'</td>' +
      '<td class="num">'+fmtEnt(p.stock)+'</td>' +
      '<td class="num">'+fmt4(p.costo)+'</td>' +
      '<td class="num">'+fmt(p.precio)+'</td>' +
      '<td class="num g-calc">'+fmt(c.pdv)+'</td>' +
      '<td class="num g-calc '+clsUtil+'">'+fmt(c.utilidad)+'</td>' +
      '<td class="num g-calc '+clsPct+'">'+(c.pct===null?"—":fmt(c.pct)+"%")+'</td>' +
      '<td class="num g-comp"><input class="comp-input" type="number" step="0.01" inputmode="decimal" ' +
        'aria-label="Costo de competencia de '+esc(p.nombre)+'" data-item="'+esc(p.item)+'" ' +
        'value="'+(c.cc===null?"":c.cc)+'" placeholder="—"></td>' +
      '<td class="num g-comp '+clsDif+'">'+(c.dif===null?"—":(c.dif>0?"+":"")+fmt(c.dif))+'</td>' +
    '</tr>';
  }
  var cuerpo = document.getElementById("cuerpo");
  if(!trozo.length){
    cuerpo.innerHTML = '<tr><td colspan="11"><div class="vacio"><b>Ningún producto coincide</b>' +
      'Probá con otra marca, otro texto de búsqueda o volvé a «Todos».</div></td></tr>';
  }else{
    cuerpo.innerHTML = html;
  }
  var texto = total===0 ? "Sin resultados"
    : "Mostrando "+fmtEnt(Math.min(STATE.ui.mostrar,total))+" de "+fmtEnt(total)+
      (total!==STATE.productos.length ? " (de "+fmtEnt(STATE.productos.length)+" del archivo)" : "");
  document.getElementById("cuentaPie").textContent = texto;
  document.getElementById("cuentaHead").textContent = fmtEnt(total)+(total===1?" producto":" productos");
  var mas = document.getElementById("btnMas");
  mas.hidden = (STATE.ui.mostrar>=total);
  mas.textContent = "Mostrar "+fmtEnt(Math.min(PASO,total-STATE.ui.mostrar))+" más";
}

function conectarResultados(){
  pintarEncabezado();
  pintarTabla();

  document.getElementById("fQ").oninput = function(){ STATE.ui.q=this.value; STATE.ui.mostrar=PASO; pintarTabla(); };
  document.getElementById("fMarca").onchange = function(){ STATE.ui.marca=this.value; STATE.ui.mostrar=PASO; pintarTabla(); };
  document.getElementById("btnMas").onclick = function(){ STATE.ui.mostrar+=PASO; pintarTabla(); };
  document.getElementById("btnExport").onclick = exportar;

  document.getElementById("fVistas").onclick = function(e){
    var b = e.target.closest("button[data-vista]");
    if(!b) return;
    STATE.ui.vista = b.getAttribute("data-vista");
    Array.prototype.forEach.call(this.querySelectorAll("button[data-vista]"), function(x){
      x.setAttribute("aria-pressed", x===b ? "true" : "false");
    });
    STATE.ui.mostrar = PASO;
    pintarTabla();
  };

  document.getElementById("encabezado").onclick = function(e){
    var b = e.target.closest("button[data-orden]");
    if(!b) return;
    var k = b.getAttribute("data-orden");
    if(STATE.ui.orden===k) STATE.ui.dir = -STATE.ui.dir;
    else { STATE.ui.orden = k; STATE.ui.dir = (k==="nombre"||k==="marca"||k==="item") ? 1 : -1; }
    STATE.ui.mostrar = PASO;
    pintarEncabezado();
    pintarTabla();
  };

  document.getElementById("cuerpo").addEventListener("input", function(e){
    var el = e.target;
    if(!el.classList || !el.classList.contains("comp-input")) return;
    var item = el.getAttribute("data-item"), crudo = el.value.trim();
    if(crudo==="") delete STATE.ui.comp[item];
    else STATE.ui.comp[item] = num(crudo);
    // Se toca solo la celda de la diferencia y el resumen: repintar la tabla acá le sacaría el foco al campo.
    var fila = el.closest("tr"), celda = fila ? fila.lastElementChild : null, prod = null;
    for(var i=0;i<STATE.productos.length;i++){ if(STATE.productos[i].item===item){ prod=STATE.productos[i]; break; } }
    if(celda && prod){
      var c = calcular(prod);
      celda.className = "num g-comp " + (c.dif===null ? "nulo" : (c.dif>0 ? "pos" : (c.dif<0 ? "neg" : "nulo")));
      celda.textContent = (c.dif===null ? "—" : (c.dif>0?"+":"")+fmt(c.dif));
    }
    document.getElementById("resumen").innerHTML = resumenHtml();
  });
}

/* ---- Exportación ---- */
function exportar(){
  if(typeof XLSX==="undefined"){ toast("El generador de Excel no está disponible."); return; }
  var lista = filtradas();
  if(!lista.length){ toast("No hay filas para exportar."); return; }
  var d = STATE.options.descuento;
  var aoa = [[
    "Item Number","Nombre","Marca","InStock","Costo Prom. Nac.","Precio Base",
    "PDV con "+d+"% desc","Utilidad","% Utilidad","Costo competencia","Dif. competencia vs PDV"
  ]];
  lista.forEach(function(o){
    var p=o.p, c=o.c;
    aoa.push([
      p.item, p.nombre, p.marca, p.stock,
      redondear(p.costo,4), redondear(p.precio,2),
      redondear(c.pdv,2), redondear(c.utilidad,2),
      c.pct===null ? "" : redondear(c.pct,2),
      c.cc===null ? "" : redondear(c.cc,2),
      c.dif===null ? "" : redondear(c.dif,2)
    ]);
  });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{wch:16},{wch:42},{wch:20},{wch:9},{wch:16},{wch:12},{wch:16},{wch:11},{wch:12},{wch:17},{wch:20}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Costeo Soldemi");
  var nombre = "costeo-soldemi-"+new Date().toISOString().slice(0,10)+".xlsx";
  try{
    XLSX.writeFile(wb, nombre);
    toast("Descargando "+nombre);
  }catch(err){
    toast("No se pudo generar el archivo: "+(err && err.message ? err.message : "error desconocido"));
  }
}
function redondear(v,n){
  if(v===null||v===undefined||!isFinite(v)) return "";
  var f=Math.pow(10,n);
  return Math.round(v*f)/f;
}

/* ---- Salida ----
   La sesión no se guarda: si hay costos de competencia tipeados, se avisa antes de perderlos. */
window.addEventListener("beforeunload", function(e){
  if(!Object.keys(STATE.ui.comp).length) return;
  e.preventDefault();
  e.returnValue = "";
  return "";
});

render();
</script>
