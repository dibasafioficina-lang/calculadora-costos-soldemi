<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Herramienta interna de Soldemi para costear el inventario: PDV con descuento, utilidad y comparativo contra la competencia.">
<title>Calculadora de Costos Soldemi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<!-- SRI: si el CDN llegara a servir un archivo distinto al verificado, el navegador lo rechaza en lugar de
     ejecutarlo sobre el inventario. Mismo hash que usa Mi Asistente Contable para esta misma versión. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
        integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root{
    color-scheme:light;
    --paper:#F1F3F2;
    --surface:#FFFFFF;
    --surface-2:#F7F9F8;
    --ink:#14191C;
    --muted:#5D6A6E;
    --faint:#889498;
    --line:#D7DEDC;
    --line-strong:#B9C4C1;
    --accent:#0D5C63;
    --accent-ink:#FFFFFF;
    --accent-soft:#E2EFEF;
    --pos:#2E7148;
    --pos-soft:#E4F0E8;
    --warn:#8F6410;
    --warn-soft:#F6EEDC;
    --crit:#A93A2B;
    --crit-soft:#F7E6E2;
    --comp:#584A8C;
    --comp-soft:#ECE9F6;
    --shadow:0 1px 2px rgba(20,25,28,.06), 0 8px 24px -16px rgba(20,25,28,.25);
    --radius:6px;
    --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
    --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --paper:#0E1416;
      --surface:#151D20;
      --surface-2:#1A2427;
      --ink:#E5EBE9;
      --muted:#94A3A5;
      --faint:#6D7C80;
      --line:#263134;
      --line-strong:#37474B;
      --accent:#57B6BC;
      --accent-ink:#0B1416;
      --accent-soft:#14292C;
      --pos:#63C08D;
      --pos-soft:#132B20;
      --warn:#D7A648;
      --warn-soft:#2C2415;
      --crit:#E67964;
      --crit-soft:#301A17;
      --comp:#A695DD;
      --comp-soft:#1F1B30;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#0E1416;
    --surface:#151D20;
    --surface-2:#1A2427;
    --ink:#E5EBE9;
    --muted:#94A3A5;
    --faint:#6D7C80;
    --line:#263134;
    --line-strong:#37474B;
    --accent:#57B6BC;
    --accent-ink:#0B1416;
    --accent-soft:#14292C;
    --pos:#63C08D;
    --pos-soft:#132B20;
    --warn:#D7A648;
    --warn-soft:#2C2415;
    --crit:#E67964;
    --crit-soft:#301A17;
    --comp:#A695DD;
    --comp-soft:#1F1B30;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }

  *,*::before,*::after{box-sizing:border-box}
  img{max-width:100%}
  [hidden]{display:none!important}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f-body);
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1500px;margin:0 auto;padding:22px 20px 64px;display:flex;flex-direction:column;gap:18px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  button{font:inherit}

  .eyebrow{
    font-family:var(--f-mono);font-size:10.5px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  }

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
    gap:18px;padding-bottom:16px;border-bottom:2px solid var(--ink);
  }
  .brand{display:flex;align-items:center;gap:13px;min-width:0}
  .mark{
    flex:0 0 auto;width:42px;height:42px;display:grid;place-items:center;
    border:1.5px solid var(--accent);border-radius:50%;color:var(--accent);
    font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;
  }
  h1{
    margin:0;font-family:var(--f-display);font-weight:700;
    font-size:clamp(22px,2.6vw,29px);letter-spacing:-.022em;line-height:1.1;text-wrap:balance;
  }
  .tagline{margin:3px 0 0;color:var(--muted);font-size:13.5px}
  .ver{
    font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;
  }
  .crumb{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--faint)}
  .crumb button{
    appearance:none;background:none;border:0;padding:0;cursor:pointer;
    font-family:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit;
    color:var(--accent);font-weight:600;
  }
  .crumb button:hover{text-decoration:underline}
  .crumb .sep{color:var(--line-strong)}
  .crumb .actual{color:var(--ink);font-weight:600}

  /* ---------- portada ---------- */
  .hero{display:flex;flex-direction:column;gap:6px;padding:14px 0 6px}
  .hero h2{
    margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,38px);
    letter-spacing:-.025em;line-height:1.05;text-wrap:balance;
  }
  .hero p{margin:0;color:var(--muted);font-size:15px;max-width:60ch}
  .modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .module{
    appearance:none;text-align:left;color:inherit;font:inherit;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px;
    box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,transform .15s;
  }
  .module:hover{border-color:var(--accent);transform:translateY(-2px)}
  .module.off{cursor:default;opacity:.62}
  .module.off:hover{border-color:var(--line);transform:none}
  .module-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .module-icon{
    width:40px;height:40px;display:grid;place-items:center;border-radius:4px;
    background:var(--accent-soft);color:var(--accent);
  }
  .module-icon svg{width:20px;height:20px}
  .module-icon.comp{background:var(--comp-soft);color:var(--comp)}
  .module-tag{
    font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:3px 8px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
  }
  .module h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.015em}
  .module p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
  .module-action{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent);margin-top:auto}
  .module.off .module-action{color:var(--faint)}
  .banner{
    font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:11px 14px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto}
  .dot.on{background:var(--pos)}
  .dot.off{background:var(--warn)}

  /* ---------- carga + calcular (en la cabecera del módulo) ---------- */
  .intake{display:flex;align-items:stretch;gap:10px;flex:0 1 640px;min-width:300px;flex-wrap:wrap}
  .loader{
    flex:1 1 330px;min-width:260px;position:relative;
    background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:var(--radius);
    padding:13px 15px;display:flex;align-items:center;gap:13px;cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .loader.is-over{border-color:var(--accent);background:var(--accent-soft)}
  .loader.is-loaded{border-style:solid;border-color:var(--line)}
  .loader-icon{
    flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;
    border-radius:4px;background:var(--accent-soft);color:var(--accent);
  }
  .loader-icon svg{width:18px;height:18px}
  .loader-body{min-width:0;flex:1}
  .loader-title{font-weight:600;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .loader-note{color:var(--muted);font-size:12.5px;display:block;margin-top:1px}
  .loader-help{margin-top:4px}
  .loader-help summary{
    list-style:none;cursor:pointer;font-family:var(--f-mono);font-size:10.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--accent);user-select:none;
  }
  .loader-help summary::-webkit-details-marker{display:none}
  .loader-help div{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:5px;padding:7px 9px;
    background:var(--surface-2);border-radius:4px;border:1px solid var(--line)}
  .calcbox{
    display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;
  }
  .field{display:flex;flex-direction:column;gap:4px;min-width:0}
  .field label{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  input[type="search"],input[type="number"],select{
    font:inherit;font-size:14px;color:var(--ink);background:var(--surface-2);
    border:1px solid var(--line-strong);border-radius:5px;padding:6px 9px;
  }
  .calcbox input[type="number"]{width:78px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
  .btn{
    appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    padding:7px 13px;border-radius:5px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
    transition:background .12s,border-color .12s;
  }
  .btn:hover{background:var(--surface-2);border-color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .btn-sm{padding:5px 10px;font-size:12.5px}
  .btn-calc{align-self:stretch;padding-left:18px;padding-right:18px}

  /* ---------- indicadores ---------- */
  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  }
  .stat{background:var(--surface);padding:12px 15px;display:flex;flex-direction:column;gap:2px}
  .stat-label{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .stat-value{font-family:var(--f-display);font-weight:600;font-size:23px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
  .stat-sub{font-size:12px;color:var(--muted)}
  .stat.is-crit .stat-value{color:var(--crit)}
  .stat.is-comp .stat-value{color:var(--comp)}

  /* ---------- filtros ---------- */
  .controls{
    display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;
  }
  input[type="search"]{width:265px;max-width:100%}
  select{max-width:230px}
  .seg{display:flex;border:1px solid var(--line-strong);border-radius:5px;overflow:hidden}
  .seg button{
    appearance:none;border:0;border-right:1px solid var(--line-strong);background:var(--surface-2);
    color:var(--muted);padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .controls-spacer{flex:1 1 auto}
  .controls-actions{display:flex;gap:8px;align-items:flex-end}

  /* ---------- tabla ---------- */
  .sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .sheet-head{
    display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;
    padding:11px 15px;border-bottom:1px solid var(--line);background:var(--surface-2);
  }
  .sheet-title{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:-.01em}
  .sheet-count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tablewrap{overflow-x:auto;max-height:min(72vh,860px);overflow-y:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px}
  thead th{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1.5px solid var(--line-strong);padding:0;text-align:left;font-weight:600}
  thead th .th-btn{
    width:100%;appearance:none;border:0;background:none;color:var(--muted);
    font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:10px 11px;cursor:pointer;text-align:inherit;display:flex;align-items:center;gap:5px;line-height:1.3;
  }
  thead th.num .th-btn{justify-content:flex-end}
  thead th .th-btn:hover{color:var(--accent)}
  thead th[aria-sort] .th-btn{color:var(--ink)}
  .sort-ind{font-size:9px;opacity:.55}
  thead th.grp-calc{background:var(--accent-soft)}
  thead th.grp-comp{background:var(--comp-soft)}
  tbody td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
  tbody tr:hover td{background:var(--surface-2)}
  td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  td.code{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
  td.nombre{min-width:250px;max-width:330px}
  td.marca{color:var(--muted);font-size:12.5px;max-width:150px}
  td.calc{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
  tbody tr:hover td.calc{background:var(--accent-soft)}
  td.comp{background:color-mix(in srgb,var(--comp-soft) 50%,transparent)}
  tbody tr:hover td.comp{background:var(--comp-soft)}
  .pos{color:var(--pos)}
  .neg{color:var(--crit)}
  .zero{color:var(--faint)}
  tr.flag-crit td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
  tr.flag-warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
  .chip{
    display:inline-block;font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;padding:1px 5px;border-radius:3px;margin-top:3px;
  }
  .chip-crit{background:var(--crit-soft);color:var(--crit)}
  .chip-warn{background:var(--warn-soft);color:var(--warn)}
  .comp-input{
    width:100%;min-width:86px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:3px 6px;color:var(--ink);
  }
  .comp-input:focus{border-color:var(--comp);outline:2px solid color-mix(in srgb,var(--comp) 35%,transparent);outline-offset:0}
  .comp-input::-webkit-outer-spin-button,.comp-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .comp-input[type=number]{-moz-appearance:textfield}
  .sheet-foot{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 15px;border-top:1px solid var(--line);background:var(--surface-2);
  }
  .empty{padding:44px 20px;text-align:center;color:var(--muted)}
  .empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}

  /* ---------- estado vacío del módulo ---------- */
  .waiting{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:38px 20px;text-align:center;color:var(--muted);box-shadow:var(--shadow);
  }
  .waiting strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;letter-spacing:-.01em;margin-bottom:4px}
  .waiting .cols{
    display:inline-flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px;
  }
  .waiting .cols span{
    font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:3px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
  }

  /* ---------- notas ---------- */
  .notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 26px;padding:16px 0 0;border-top:1px solid var(--line)}
  .note h3{margin:0 0 5px;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
  .note p{margin:0 0 5px;font-size:13px;color:var(--muted);line-height:1.5}
  .note code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:1px 4px;color:var(--ink)}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:5px;font-size:13.5px;font-weight:600;
    box-shadow:var(--shadow);z-index:50;max-width:min(88vw,520px);text-align:center;
  }
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:720px){
    .page{padding:16px 12px 48px}
    .masthead{align-items:flex-start}
    .intake,.loader{flex-basis:100%}
    input[type="search"]{width:100%}
    .field{flex:1 1 150px}
  }
</style>
</head>
<body>
<div class="page" id="app"></div>

<script>
"use strict";

var APP_VERSION = "2026.09.11b";

/* ---------------- Estado ----------------
   Todo vive en memoria. No se guarda NADA en localStorage —ni siquiera preferencias de vista—:
   al recargar la pestaña la sesión arranca limpia. */
var STATE = {
  view: "menu",
  files: { inventario: null },
  options: { descuento: 30 },     // el % que se APLICÓ al calcular; el campo puede ir por delante
  productos: null,                // filas leídas del Excel
  ui: {
    q: "", marca: "", vista: "todos",
    orden: "nombre", dir: 1, mostrar: 120,
    comp: {}                      // Item Number -> costo de competencia tipeado a mano
  }
};

var app = document.getElementById("app");
var PASO = 120;                   // filas que se agregan por tanda al pulsar "Mostrar más"

/* ---------------- Utilidades ---------------- */
// Escapa texto que viene de un ARCHIVO antes de meterlo en innerHTML. Sin esto, una celda del Excel con
// "<svg onload=...>" se ejecuta como HTML en el navegador de quien abre el reporte.
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
// Formato de las cifras que se MUESTRAN: separador de miles + 2 decimales (1,000.00).
function fmt(n){
  var v=Number(n); if(isNaN(v)) v=0;
  var neg=v<0, partes=Math.abs(v).toFixed(2).split(".");
  return (neg?"-":"")+partes[0].replace(/\B(?=(\d{3})+(?!\d))/g,",")+"."+partes[1];
}
// El costo del sistema viene con 4 decimales (1.3067). Redondearlo a 2 en pantalla escondería diferencias
// reales de costeo, así que se muestran los decimales que traiga, con un mínimo de dos.
function fmt4(n){
  var v=Number(n); if(isNaN(v)) v=0;
  var neg=v<0, s=Math.abs(v).toFixed(4).replace(/0+$/,"").replace(/\.$/,"");
  var partes=s.split("."); if(partes.length===1) partes.push("00");
  if(partes[1].length===1) partes[1]+="0";
  return (neg?"-":"")+partes[0].replace(/\B(?=(\d{3})+(?!\d))/g,",")+"."+partes[1];
}
function fmtEnt(n){ var v=Number(n)||0; return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function normTxt(s){
  if(s===null||s===undefined) return "";
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
}
// Los montos del sistema llegan como número, pero un Excel reexportado a mano puede traerlos como texto
// ("1.234,56" o "B/. 12.30"). Se limpia antes de operar para no terminar sumando NaN.
function num(v){
  if(typeof v==="number") return isFinite(v)? v : 0;
  if(v===null||v===undefined||v==="") return 0;
  var s=String(v).replace(/[^0-9,.\-]/g,"");
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1) s=s.replace(/\./g,"").replace(",",".");
  else if(s.indexOf(",")>-1) s=s.replace(",",".");
  var n=parseFloat(s);
  return isFinite(n)? n : 0;
}
function toast(msg){
  var t=document.createElement("div");
  t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 3600);
}

   El nombre de la casilla usa el vocabulario del sistema de origen, no el de quien va a usar esto. Sin la
   instruccion de exportacion, alguien que no conozca el circuito no puede ni empezar. */
var DE_DONDE = {
  inventario: "Del sistema: Inventario → Inventario Actual → Exportar a Excel. Se exporta completo, sin filtrar por marca ni por bodega: el listado sale con todo lo que traiga el archivo. No hace falta borrar columnas ni renombrar encabezados."
};

/* ---- Lectura del Excel ----
   Las columnas se detectan por NOMBRE de encabezado (tolerante a acentos y mayúsculas). Si el sistema
   cambiara los títulos, se cae a la POSICIÓN que tienen hoy en el export: B, D, E, G, J y K. */
var ENCABEZADOS = {
  item:   ["item number","itemnumber","item","codigo de barras","upc","upc_code"],
  nombre: ["nombre","descripcion","description"],
  marca:  ["marca","brand"],
  stock:  ["instock","in stock","stock","existencia","existencias"],
  costo:  ["costo prom. nac.","costo prom nac","costo promedio nac","costo nac","costo"],
  precio: ["precio base","precio","precio de venta"]
};
var POSICION = { item:1, nombre:3, marca:4, stock:6, costo:9, precio:10 };

function mapearColumnas(fila){
  var idx={}, usado={}, enc=(fila||[]).map(normTxt);
  Object.keys(ENCABEZADOS).forEach(function(clave){
    var hallado=-1;
    for(var h=0; h<ENCABEZADOS[clave].length && hallado<0; h++){
      var buscado=normTxt(ENCABEZADOS[clave][h]);
      for(var i=0;i<enc.length;i++){
        if(usado[i]) continue;
        if(enc[i]===buscado){ hallado=i; break; }
      }
    }
    if(hallado<0) hallado=POSICION[clave];
    idx[clave]=hallado; usado[hallado]=true;
  });
  return idx;
}

function leerInventario(buffer){
  var wb = XLSX.read(buffer, {type:"array"});
  var ws = wb.Sheets[wb.SheetNames[0]];
  var grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:false});
  if(!grid.length) throw new Error("La hoja está vacía.");
  var idx = mapearColumnas(grid[0]||[]);
  var filas=[];
  for(var i=1;i<grid.length;i++){
    var g=grid[i]; if(!g) continue;
    var item=g[idx.item], nombre=g[idx.nombre];
    // El export cierra con una fila suelta sin código ni nombre; se descarta para que no cuente como producto.
    if((item===null||item===undefined||item==="") && (nombre===null||nombre===undefined||nombre==="")) continue;
    filas.push({
      item:   String(item===null||item===undefined?"":item).trim(),
      nombre: String(nombre===null||nombre===undefined?"":nombre).trim(),
      marca:  String(g[idx.marca]===null||g[idx.marca]===undefined?"":g[idx.marca]).trim(),
      stock:  num(g[idx.stock]),
      costo:  num(g[idx.costo]),
      precio: num(g[idx.precio])
    });
  }
  if(!filas.length) throw new Error("No se encontraron filas de productos.");
  return filas;
}

/* ---------------- Cálculo ---------------- */
function calcular(p){
  var d = STATE.options.descuento/100;
  var pdv = p.precio*(1-d);
  var utilidad = pdv - p.costo;                          // utilidad = PDV con descuento − costo
  var pct = pdv>0 ? (utilidad/pdv)*100 : null;
  var cc = STATE.ui.comp[p.item];
  var dif = (typeof cc==="number") ? cc - pdv : null;    // positivo = la competencia está por encima
  return {pdv:pdv, utilidad:utilidad, pct:pct, cc:(typeof cc==="number"?cc:null), dif:dif};
}
// Rojo: el producto no puede costearse o se vende perdiendo. Ámbar: se puede costear pero falta un dato.
function alerta(p, c){
  if(p.costo<=0 || c.utilidad<0) return "crit";
  if(p.precio<=0 || p.stock<=0) return "warn";
  return "";
}

// Se puede soltar el archivo en cualquier parte de la página, no solo sobre la casilla. Los listeners van
// en document y se registran UNA sola vez: cada render vuelve a crear la casilla, así que se busca al momento.
(function(){
  function casilla(){ return document.getElementById("loader"); }
  ["dragenter","dragover"].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); var l=casilla(); if(l) l.classList.add("is-over"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    document.addEventListener(ev, function(e){
      e.preventDefault();
      if(ev==="dragleave" && e.relatedTarget) return;
      var l=casilla(); if(l) l.classList.remove("is-over");
    });
  });
  document.addEventListener("drop", function(e){
    e.preventDefault();
    if(STATE.view!=="modulo1") return;
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) tomarArchivo(f);
  });
})();

function tomarArchivo(f){
  STATE.files.inventario = f;

  STATE.ui.mostrar = PASO;
  render();
}

function leerDescuento(){
  var el = document.getElementById("optDesc");
  var v = el ? num(el.value) : STATE.options.descuento;
  if(!isFinite(v)) v = 0;
  return Math.min(100, Math.max(0, v));
}

function ejecutar(){
  var f = STATE.files.inventario;
  if(!f) return;
  if(typeof XLSX==="undefined"){ toast("No se pudo cargar el lector de Excel. Recargá la página."); return; }
  STATE.options.descuento = leerDescuento();
  // Si el archivo ya está leído, Calcular solo aplica el % nuevo: no hace falta volver a leer 5,000 filas.
  if(STATE.productos){
    STATE.ui.mostrar = PASO;
    render();
    toast("Recalculado con "+STATE.options.descuento+"% de descuento · "+fmtEnt(STATE.productos.length)+" productos");
    return;
  }
  var btn = document.getElementById("btnRun");
  if(btn){ btn.disabled = true; btn.textContent = "Leyendo…"; }
  var fr = new FileReader();
  fr.onload = function(e){
    try{
      STATE.productos = leerInventario(new Uint8Array(e.target.result));
      STATE.ui.mostrar = PASO;
      STATE.ui.q = ""; STATE.ui.marca = ""; STATE.ui.vista = "todos";
      render();
      toast(fmtEnt(STATE.productos.length)+" productos costeados con "+STATE.options.descuento+"% de descuento");
    }catch(err){
      render();
      toast("No se pudo leer el archivo: "+(err && err.message ? err.message : "formato no reconocido"));
    }
  };
  fr.onerror = function(){ render(); toast("No se pudo abrir el archivo."); };
  fr.readAsArrayBuffer(f);
}

function filtradas(){
  var q = normTxt(STATE.ui.q), m = STATE.ui.marca, v = STATE.ui.vista, out = [];
  for(var i=0;i<STATE.productos.length;i++){
    var p = STATE.productos[i];
    if(m && p.marca!==m) continue;
    if(q && normTxt(p.nombre).indexOf(q)<0 && normTxt(p.marca).indexOf(q)<0 && String(p.item).indexOf(q)<0) continue;
    var c = calcular(p);
    if(v==="stock" && !(p.stock>0)) continue;
    if(v==="comparados" && c.cc===null) continue;
    if(v==="alertas" && !alerta(p,c)) continue;
    out.push({p:p, c:c});
  }
  var k = STATE.ui.orden, dir = STATE.ui.dir;
  out.sort(function(a,b){
    var va=valor(a,k), vb=valor(b,k);
    if(va===null) return 1;
    if(vb===null) return -1;
    if(typeof va==="string") return va.localeCompare(vb,"es")*dir;
    return (va-vb)*dir;
  });
  return out;
}
function valor(o,k){
  if(k==="item") return String(o.p.item);
  if(k==="nombre"||k==="marca") return o.p[k];
  if(k==="stock"||k==="costo"||k==="precio") return o.p[k];
  return o.c[k]===undefined ? null : o.c[k];
}

function resumenHtml(){
  var n=STATE.productos.length, conStock=0, alertas=0, comparados=0, debajo=0;
  var sumUtil=0, sumPdv=0, costeables=0;
  STATE.productos.forEach(function(p){
    var c=calcular(p);
    if(p.stock>0) conStock++;
    if(alerta(p,c)) alertas++;
    if(c.cc!==null){ comparados++; if(c.dif<0) debajo++; }
    if(p.costo>0 && p.precio>0){ sumUtil+=c.utilidad; sumPdv+=c.pdv; costeables++; }
  });
  var prom = sumPdv>0 ? (sumUtil/sumPdv)*100 : null;
  var d = STATE.options.descuento;
  var tiles = [
    {l:"Productos", v:fmtEnt(n), s:fmtEnt(costeables)+" con costo y precio"},
    {l:"Con stock", v:fmtEnt(conStock), s:fmtEnt(n-conStock)+" en cero"},
    {l:"Utilidad promedio", v:(prom===null?"—":fmt(prom)+"%"), s:"sobre el PDV con "+d+"% desc", cls:(prom!==null && prom<0)?"is-crit":""},
    {l:"Alertas", v:fmtEnt(alertas), s:"costo, precio o margen", cls:alertas?"is-crit":""},
    {l:"Comparados", v:fmtEnt(comparados), s:(comparados? fmtEnt(debajo)+" por debajo de tu PDV" : "cargá un costo de competencia"), cls:"is-comp"}
  ];
  return tiles.map(function(t){
    return '<div class="stat '+(t.cls||"")+'"><span class="stat-label">'+t.l+'</span><span class="stat-value">'+t.v+'</span><span class="stat-sub">'+t.s+'</span></div>';
  }).join("");
}

function pintarEncabezado(){
  var d = STATE.options.descuento, html="";
  COLUMNAS.forEach(function(c){
    var etiqueta = c.k==="pdv" ? ("PDV con "+d+"% desc") : c.t;
    var ordenado = (STATE.ui.orden===c.k);
    var ind = ordenado ? (STATE.ui.dir===1 ? "▲" : "▼") : "";
    html += '<th class="'+(c.num?"num ":"")+c.grp+'"'+(ordenado ? ' aria-sort="'+(STATE.ui.dir===1?"ascending":"descending")+'"' : '')+'>'+
      '<button class="th-btn" type="button" data-orden="'+c.k+'">'+esc(etiqueta)+'<span class="sort-ind" aria-hidden="true">'+ind+'</span></button></th>';
  });
  document.getElementById("encabezado").innerHTML = html;
}

function pintarTabla(){
  // Se repinta SOLO el cuerpo de la tabla, no la vista entera: un render completo en cada tecla le sacaría
  // el foco al campo de costo de competencia que la persona está tipeando.
  var lista = filtradas(), total = lista.length;
  var trozo = lista.slice(0, STATE.ui.mostrar), html="";
  for(var i=0;i<trozo.length;i++){
    var p=trozo[i].p, c=trozo[i].c, f=alerta(p,c), chip="";
    if(p.costo<=0) chip='<span class="chip chip-crit">sin costo</span>';
    else if(c.utilidad<0) chip='<span class="chip chip-crit">se vende perdiendo</span>';
    else if(p.precio<=0) chip='<span class="chip chip-warn">sin precio</span>';
    else if(p.stock<=0) chip='<span class="chip chip-warn">sin stock</span>';

    var clsPct = c.pct===null ? "zero" : (c.pct<0 ? "neg" : "");
    var clsUtil = c.utilidad<0 ? "neg" : "";
    var clsDif = c.dif===null ? "zero" : (c.dif>0 ? "pos" : (c.dif<0 ? "neg" : "zero"));

    html += '<tr'+(f?' class="flag-'+f+'"':'')+'>' +
      '<td class="code">'+esc(p.item)+'</td>' +
      '<td class="nombre">'+esc(p.nombre)+(chip?'<br>'+chip:'')+'</td>' +
      '<td class="marca">'+esc(p.marca||"—")+'</td>' +
      '<td class="num">'+fmtEnt(p.stock)+'</td>' +
      '<td class="num">'+fmt4(p.costo)+'</td>' +
      '<td class="num">'+fmt(p.precio)+'</td>' +
      '<td class="num calc">'+fmt(c.pdv)+'</td>' +
      '<td class="num calc '+clsUtil+'">'+fmt(c.utilidad)+'</td>' +
      '<td class="num calc '+clsPct+'">'+(c.pct===null?"—":fmt(c.pct)+"%")+'</td>' +
      '<td class="num comp"><input class="comp-input" type="number" step="0.01" inputmode="decimal" ' +
        'aria-label="Costo de competencia de '+esc(p.nombre)+'" data-item="'+esc(p.item)+'" ' +
        'value="'+(c.cc===null?"":c.cc)+'" placeholder="—"></td>' +
      '<td class="num comp '+clsDif+'">'+(c.dif===null?"—":(c.dif>0?"+":"")+fmt(c.dif))+'</td>' +
    '</tr>';
  }
  var cuerpo = document.getElementById("cuerpo");
  if(!trozo.length){
    cuerpo.innerHTML = '<tr><td colspan="11"><div class="empty"><strong>Ningún producto coincide</strong>' +
      'Probá con otra marca, otro texto de búsqueda o volvé a «Todos».</div></td></tr>';
  }else{
    cuerpo.innerHTML = html;
  }
  var texto = total===0 ? "Sin resultados"
    : "Mostrando "+fmtEnt(Math.min(STATE.ui.mostrar,total))+" de "+fmtEnt(total)+
      (total!==STATE.productos.length ? " (de "+fmtEnt(STATE.productos.length)+" del archivo)" : "")+
      " · nada se guarda al cerrar";
  document.getElementById("cuentaPie").textContent = texto;
  document.getElementById("cuentaHead").textContent = fmtEnt(total)+(total===1?" producto":" productos");
  var mas = document.getElementById("btnMas");
  mas.hidden = (STATE.ui.mostrar>=total);
  mas.textContent = "Mostrar "+fmtEnt(Math.min(PASO,total-STATE.ui.mostrar))+" más";
}

function conectarResultados(){
  pintarEncabezado();
  pintarTabla();

  document.getElementById("fQ").oninput = function(){ STATE.ui.q=this.value; STATE.ui.mostrar=PASO; pintarTabla(); };
  document.getElementById("fMarca").onchange = function(){ STATE.ui.marca=this.value; STATE.ui.mostrar=PASO; pintarTabla(); };
  document.getElementById("btnMas").onclick = function(){ STATE.ui.mostrar+=PASO; pintarTabla(); };
  document.getElementById("btnExport").onclick = exportar;
  document.getElementById("btnLimpiar").onclick = function(){
    var n = Object.keys(STATE.ui.comp).length;
    if(!n){ toast("No hay costos de competencia cargados."); return; }
    if(!confirm("¿Borrar los "+n+" costos de competencia cargados?")) return;
    STATE.ui.comp = {};
    document.getElementById("resumen").innerHTML = resumenHtml();
    pintarTabla();
    toast("Costos de competencia borrados.");
  };

  document.getElementById("fVistas").onclick = function(e){
    var b = e.target.closest("button[data-vista]");
    if(!b) return;
    STATE.ui.vista = b.getAttribute("data-vista");
    Array.prototype.forEach.call(this.querySelectorAll("button[data-vista]"), function(x){
      x.setAttribute("aria-pressed", x===b ? "true" : "false");
    });
    STATE.ui.mostrar = PASO;
    pintarTabla();
  };

  document.getElementById("encabezado").onclick = function(e){
    var b = e.target.closest("button[data-orden]");
    if(!b) return;
    var k = b.getAttribute("data-orden");
    if(STATE.ui.orden===k) STATE.ui.dir = -STATE.ui.dir;
    else { STATE.ui.orden = k; STATE.ui.dir = (k==="nombre"||k==="marca"||k==="item") ? 1 : -1; }
    STATE.ui.mostrar = PASO;
    pintarEncabezado();
    pintarTabla();
  };

  document.getElementById("cuerpo").addEventListener("input", function(e){
    var el = e.target;
    if(!el.classList || !el.classList.contains("comp-input")) return;
    var item = el.getAttribute("data-item"), crudo = el.value.trim();
    if(crudo==="") delete STATE.ui.comp[item];
    else STATE.ui.comp[item] = num(crudo);
    // Se toca solo la celda de la diferencia y el resumen: repintar la tabla acá le sacaría el foco al campo.
    var fila = el.closest("tr"), celda = fila ? fila.lastElementChild : null, prod = null;
    for(var i=0;i<STATE.productos.length;i++){ if(STATE.productos[i].item===item){ prod=STATE.productos[i]; break; } }
    if(celda && prod){
      var c = calcular(prod);
      celda.className = "num comp " + (c.dif===null ? "zero" : (c.dif>0 ? "pos" : (c.dif<0 ? "neg" : "zero")));
      celda.textContent = (c.dif===null ? "—" : (c.dif>0?"+":"")+fmt(c.dif));
    }
    document.getElementById("resumen").innerHTML = resumenHtml();
  });
}

/* ---- Exportación ---- */
function exportar(){
  if(typeof XLSX==="undefined"){ toast("El generador de Excel no está disponible."); return; }
  var lista = filtradas();
  if(!lista.length){ toast("No hay filas para exportar."); return; }
  var d = STATE.options.descuento;
  var aoa = [[
    "Item Number","Nombre","Marca","InStock","Costo Prom. Nac.","Precio Base",
    "PDV con "+d+"% desc","Utilidad","% Utilidad","Costo competencia","Dif. competencia vs PDV"
  ]];
  lista.forEach(function(o){
    var p=o.p, c=o.c;
    aoa.push([
      p.item, p.nombre, p.marca, p.stock,
      redondear(p.costo,4), redondear(p.precio,2),
      redondear(c.pdv,2), redondear(c.utilidad,2),
      c.pct===null ? "" : redondear(c.pct,2),
      c.cc===null ? "" : redondear(c.cc,2),
      c.dif===null ? "" : redondear(c.dif,2)
    ]);
  });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{wch:16},{wch:42},{wch:20},{wch:9},{wch:16},{wch:12},{wch:16},{wch:11},{wch:12},{wch:17},{wch:20}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Costeo Soldemi");
  var nombre = "costeo-soldemi-"+new Date().toISOString().slice(0,10)+".xlsx";
  try{
    XLSX.writeFile(wb, nombre);
    toast("Descargando "+nombre);
  }catch(err){
    toast("No se pudo generar el archivo: "+(err && err.message ? err.message : "error desconocido"));
  }
}
function redondear(v,n){
  if(v===null||v===undefined||!isFinite(v)) return "";
  var f=Math.pow(10,n);
  return Math.round(v*f)/f;
}

/* ---- Salida ----
   La sesión no se guarda: si hay costos de competencia tipeados, se avisa antes de perderlos. */
window.addEventListener("beforeunload", function(e){
  if(!Object.keys(STATE.ui.comp).length) return;
  e.preventDefault();
  e.returnValue = "";
  return "";
});

render();
</script>
